name: Build and deploy
run-name: Release ${{ github.sha }}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build one release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend and deployment regression tests
        run: |
          python -m pip install -r requirements.txt pytest
          python - <<'PY'
          import sys
          import app.config as config
          config.settings = config.Settings(_env_file=None, database_url='sqlite://')
          import pytest
          sys.exit(pytest.main(['tests/test_user_default_permissions.py', 'tests/test_deployment_release.py', '-q']))
          PY
      - name: Frontend type check
        working-directory: frontend
        run: |
          npm ci
          npx vue-tsc -b
      - name: Build immutable application image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "wecom-ops-console-release:$GITHUB_SHA" .
      - name: Actual application startup and frontend smoke test
        run: |
          set -euo pipefail
          trap 'docker rm -f wecom-ci-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name wecom-ci-smoke \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e CRM_PROFILE_ENABLED=true -e AI_COACH_ENABLED=true \
            -e IMAGE_GEN_ENABLED=true -e RAG_ENABLED=false \
            -e AI_BASE_URL=http://127.0.0.1:9 -e AI_API_KEY= \
            --entrypoint uvicorn "wecom-ops-console-release:$GITHUB_SHA" \
            app.main:app --host 0.0.0.0 --port 8000 --workers 1
          ready=0
          for attempt in $(seq 1 40); do
            if docker exec -i wecom-ci-smoke python - < scripts/deploy/probe.py; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != 1 ]; then docker logs --tail 60 wecom-ci-smoke; exit 1; fi
      - name: Package exact commit and image
        if: github.event_name != 'pull_request'
        run: python scripts/deploy/package_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: wecom-release-${{ github.sha }}
          path: release/release.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  deploy-test:
    name: Deploy test and verify
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: test
    concurrency:
      group: wecom-deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wecom-release-${{ github.sha }}
          path: release
      - name: Send the tested immutable image
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: python scripts/deploy/send_release.py
      - name: Release summary
        run: echo "Test deployed successfully. Commit $GITHUB_SHA. Production requires your approval." >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Production - manual approval required
    needs: deploy-test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    concurrency:
      group: wecom-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wecom-release-${{ github.sha }}
          path: release
      - name: Deploy the same artifact approved after test
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: python scripts/deploy/send_release.py
      - name: Release summary
        run: echo "Production deployed and verified. Commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
